check_interval: 3
vision_interval: 90
enable_vision: true
vision_model: moondream
chat_model: llama3.1:8b
enable_voice: false
voice_volume: 0.0
enable_gui_popup: true
limits:
  game_minutes: 30
  youtube_entertainment_minutes: 15
